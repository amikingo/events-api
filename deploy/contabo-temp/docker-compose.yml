# TEMPORARY deployment on the shared Contabo VPS (169.58.247.85). Remove once events gets a real setup
# like bookings. Steps and removal: README.md in this folder.
#
# Expected layout on the server:
#   ~/events/events-api   (clone; its Dockerfile builds `api`; this file is in deploy/contabo-temp/)
#   ~/events/events-web   (clone; its Dockerfile builds `web`)
#   ~/events/db.env       (secrets, created on the server, never in git)
#   ~/events/api.env      (secrets, created on the server, never in git)
#
# Public address: https://eventra-dev.duckdns.org. The server's Caddy (shared with teammates' sites) holds the
# https certificate and forwards to nginx on 127.0.0.1:8080 (README "Caddy").
#
# Published ports (Docker-published ports bypass ufw):
#   127.0.0.1:8080  nginx (website + /api), reachable only from this server, i.e. through Caddy
#   15432           Postgres, shared with the team's own local events-api and pgAdmin (one login: events, from
#                   db.env). Encrypted connections only (pg_hba.conf). Rules: README "Team database access".
name: events-temp

x-public-url: &public_url https://eventra-dev.duckdns.org

services:
  db:
    # Debian image (not alpine): it ships the self-signed certificate used for SSL below. Do not switch
    # images once the database exists: alpine and Debian sort text differently and indexes can break.
    image: postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    env_file: ../../../db.env # POSTGRES_USER, POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: events
    ports:
      - "15432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d events"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../db.env # POSTGRES_USER, POSTGRES_PASSWORD
      - ../../../api.env # APP_AUTH_TOKEN, CENTRAL_AUTH_SERVICE_ID
    environment:
      NODE_ENV: production
      PORT: "5010"
      TRUST_PROXY_HOPS: "2" # Caddy, then nginx
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: events
      # pg_hba.conf accepts encrypted connections only; the certificate is self-signed, hence no-verify.
      POSTGRES_SSL: no-verify
      CENTRAL_AUTH_API: https://auth.cheche.et/api
      CORS_ALLOWED_ORIGINS: *public_url
      AUTH_REFRESH_TRUSTED_ORIGINS: *public_url
      # Same as bookings_api: the public API sits under /api, so cookie paths must include it.
      AUTH_REFRESH_COOKIE_PATH_PREFIX: /api
      # Refresh cookies are Secure (the production default): the site is https through Caddy.
      FILES_DIR: /assets/uploads
      # Real SMS through Cheche's platform AfroMessage account. The token comes from the GitHub secret
      # PLATFORM_SMS_AFROMESSAGE_TOKEN, written into ~/events/api.env by each events-api deploy; the from id and
      # sender are identifiers, not secrets (the same values as bookings). This API is the only sender for the
      # shared database: local APIs pointed at it keep OUTBOX_WORKER_ENABLED=false.
      SMS_DELIVERY: afromessage
      PLATFORM_SMS_AFROMESSAGE_FROM_ID: e80ad9d8-adf3-463f-80f4-7c4b39f7f164
      PLATFORM_SMS_SENDER: CHECHE
      # Paid checkout through Cheche Pay v2. CHECHE_PAY_CREDENTIALS_KEY (encrypts the organizers' saved Cheche Pay
      # keys) comes from the GitHub secret of the same name, written into ~/events/api.env by each events-api
      # deploy. It must stay the same value as every other API using the shared database, or saved keys become
      # unreadable. Without it, paid sales are simply unavailable.
      CHECHE_PAY_FINANCE_BASE_URL: https://merchant.chechepay.com/finance/api/v1
      # nginx removes /api, so this reaches the API's /v1/payments/cheche/webhook/:organizationId route.
      CHECHE_PAY_CALLBACK_URL: https://eventra-dev.duckdns.org/api/v1/payments/cheche/webhook/{organization_id}
      # events-web's order page.
      CHECHE_PAY_RETURN_URL: https://eventra-dev.duckdns.org/orders/{reference}?tx_ref={tx_ref}
    volumes:
      - uploads:/assets/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../../events-web
      dockerfile: Dockerfile # events-web's own Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://eventra-dev.duckdns.org/api
    environment:
      # Server-rendered pages call the API directly inside Docker instead of going out to the public address
      # and back in (faster, and it doesn't depend on Caddy, DNS or the server's firewall).
      API_INTERNAL_URL: http://api:5010
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # Caddy only; not published to the internet
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  db-data:
  uploads:
