# Who may connect to the events-temp database, and how.
# The database is published on port 15432 to the internet, so every network connection must be encrypted
# (hostssl) and use a password (scram-sha-256). Plain, unencrypted connections are refused.
#
# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            trust          # inside the db container only (docker compose exec db psql)
hostssl  all       all   all      scram-sha-256  # the api container, teammates' local APIs, pgAdmin
