# One address for both apps, like bookings (bookings.cheche.et and bookings.cheche.et/api):
#   http://169.58.247.85:8080/       -> events-web
#   http://169.58.247.85:8080/api/   -> events-api (the /api prefix is removed before it reaches the API)
server {
    listen 80;
    server_name _;

    # Event covers are up to 5 MB.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:5010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
